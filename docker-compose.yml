services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: tailscale-traffic-collector
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./data:/data
      - ./config.yaml:/config.yaml
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tailscale-traffic-dashboard
    restart: unless-stopped
    ports:
      - "4656:8000"
    volumes:
      - ./data:/data
      - ./config.yaml:/config.yaml
