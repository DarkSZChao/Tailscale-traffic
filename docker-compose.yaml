services:
  collector:
    image: tailscale-traffic-collector:local
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: tailscale-traffic-collector
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./data:/data
      - ./config.yaml:/config.yaml
      # Follow socket replacement within the directory. If tailscaled replaces
      # the directory itself, recreate the collector to refresh its mount.
      - /run/tailscale:/var/run/tailscale:ro

  blocker:
    image: tailscale-traffic-collector:local
    pull_policy: never
    container_name: tailscale-traffic-blocker
    command: ["python", "-m", "app.blocker"]
    restart: unless-stopped
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /run:size=1m
    mem_limit: 64m
    volumes:
      - ./data:/data
      - ./config.yaml:/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-m", "app.blocker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tailscale-traffic-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:4656:8000"
      - "100.81.5.63:4656:8000"
    volumes:
      - ./data:/data
      - ./config.yaml:/config.yaml
