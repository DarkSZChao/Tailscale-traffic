services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: tailscale-traffic-collector
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./data:/data
      - ./config.yaml:/config.yaml
      # Mount the runtime directory rather than the socket inode itself.
      # tailscaled replaces its socket during upgrades/restarts; a directory
      # bind mount lets the collector see the replacement without recreation.
      - /run/tailscale:/var/run/tailscale:ro

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tailscale-traffic-dashboard
    restart: unless-stopped
    ports:
      - "4656:8000"
    volumes:
      - ./data:/data
      - ./config.yaml:/config.yaml
